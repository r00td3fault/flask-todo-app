name: Flask CI

# Se activa al hacer push o pull request a la rama main
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # strategy:
    #   matrix:
    #     python-version: ["3.9", "3.12", "3.14"] #Probar distintas versiones de python

    steps:
    - name: Descargar código del repo
      uses: actions/checkout@v6

    - name: Configurar Python # ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: 3.14 # ${{ matrix.python-version }}

    - name: Instalar dependencias
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8
        pip install pytest-cov
        pip install safety

    - name: Escaneo de seguridad de dependencias
      run: |
        safety check

    - name: Verificar estilo de código con flake8
      run: |
        # Detiene el proceso si hay errores sintácticos o variables no usadas
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # Advertencias de estilo (no detiene el proceso, pero informa)
        #flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Ejecutar pruebas con reporte de cobertura
      run: |
        pytest --cov=app --cov-report=xml